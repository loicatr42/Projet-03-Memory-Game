<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Games</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Memory Games</h1>
    </header>

    <main>
      <section class="game">
        <div class="game-info">
          <p>Coups : <span id="moves">0</span></p>

          <button id="restart-button" type="button">Recommencer</button>
        </div>

        <p class="message" aria-live="polite"></p>

        <div class="game-board" aria-label="Jeu de Memory">
          <button class="card" type="button" data-card="AH">
            <img src="images/AH.png" alt="As de cœur" />
          </button>

          <button class="card" type="button" data-card="AS">
            <img src="images/AS.png" alt="As de pique" />
          </button>

          <button class="card" type="button" data-card="JH">
            <img src="images/JH.png" alt="Valet de cœur" />
          </button>

          <button class="card" type="button" data-card="JS">
            <img src="images/JS.png" alt="Valet de pique" />
          </button>

          <button class="card" type="button" data-card="KH">
            <img src="images/KH.png" alt="Roi de cœur" />
          </button>

          <button class="card" type="button" data-card="KS">
            <img src="images/KS.png" alt="Roi de pique" />
          </button>

          <button class="card" type="button" data-card="QH">
            <img src="images/QH.png" alt="Dame de cœur" />
          </button>

          <button class="card" type="button" data-card="QS">
            <img src="images/QS.png" alt="Dame de pique" />
          </button>

          <button class="card" type="button" data-card="AH">
            <img src="images/AH.png" alt="As de cœur" />
          </button>

          <button class="card" type="button" data-card="AS">
            <img src="images/AS.png" alt="As de pique" />
          </button>

          <button class="card" type="button" data-card="JH">
            <img src="images/JH.png" alt="Valet de cœur" />
          </button>

          <button class="card" type="button" data-card="JS">
            <img src="images/JS.png" alt="Valet de pique" />
          </button>

          <button class="card" type="button" data-card="KH">
            <img src="images/KH.png" alt="Roi de cœur" />
          </button>

          <button class="card" type="button" data-card="KS">
            <img src="images/KS.png" alt="Roi de pique" />
          </button>

          <button class="card" type="button" data-card="QH">
            <img src="images/QH.png" alt="Dame de cœur" />
          </button>

          <button class="card" type="button" data-card="QS">
            <img src="images/QS.png" alt="Dame de pique" />
          </button>
        </div>
      </section>
    </main>

    <footer>Projet 03 - Memory Games</footer>

    <script src="js/script.js"></script>
  </body>
</html>
